<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagnóstico de instalación — BiblioÑuble</title><link rel="manifest" href="./manifest.webmanifest"><style>body{font:18px/1.5 system-ui,sans-serif;max-width:680px;margin:auto;padding:22px;background:#f5f8fd;color:#172c49}h1{font-size:27px}section{background:white;padding:18px;border-radius:14px;margin:12px 0;overflow-wrap:anywhere}button{font:inherit;padding:12px 16px;background:#153e78;color:white;border:0;border-radius:8px}pre{white-space:pre-wrap;font-size:14px}</style></head><body><h1>Diagnóstico de instalación de BiblioÑuble</h1><p>Esta página comprueba las condiciones observables desde tu navegador. No instala nada ni envía datos personales.</p><section id="report">Comprobando…</section><button id="refresh">Volver a comprobar</button> <button id="copy">Copiar informe</button><p><a href="./">Volver a la biblioteca</a></p><script>let promptReady=false;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptReady=true;run()});async function run(){let lines=[];const add=(k,v)=>lines.push(k+': '+v);add('Fecha',new Date().toLocaleString('es-CL'));add('Navegador',navigator.userAgent);add('HTTPS',location.protocol==='https:'?'Sí':'No');add('Modo aplicación',matchMedia('(display-mode: standalone)').matches?'Sí':'No');add('Instalación nativa ofrecida',promptReady?'Sí':'No, por ahora');add('Service Worker compatible','serviceWorker'in navigator?'Sí':'No');if('serviceWorker'in navigator){try{const reg=await navigator.serviceWorker.getRegistration('./');add('Service Worker registrado',reg?'Sí':'No');add('Service Worker activo',reg?.active?'Sí':'No')}catch(e){add('Error Service Worker',e.message)}}try{const response=await fetch('./manifest.webmanifest',{cache:'no-store'});const manifest=await response.json();add('Manifiesto HTTP',response.status);add('Nombre',manifest.name);add('Modo',manifest.display);add('Inicio',new URL(manifest.start_url,location.href).href);for(const icon of manifest.icons||[]){try{const u=new URL(icon.src,new URL('./manifest.webmanifest',location.href));const res=await fetch(u,{cache:'no-store'});const b=await res.blob();const bmp=await createImageBitmap(b);add('Ícono '+icon.sizes,res.status+' / '+bmp.width+'x'+bmp.height+' / '+b.type)}catch(e){add('Error ícono '+icon.src,e.message)}}}catch(e){add('Error manifiesto',e.message)}document.querySelector('#report').innerHTML='<pre></pre>';document.querySelector('#report pre').textContent=lines.join('\n');}document.querySelector('#refresh').onclick=run;document.querySelector('#copy').onclick=()=>navigator.clipboard.writeText(document.querySelector('#report').innerText).then(()=>alert('Informe copiado'));run();</script></body></html>
